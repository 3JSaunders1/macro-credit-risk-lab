version: "3.9"

services:

  api:
    build: .
    container_name: credit_api
    ports:
      - "8000:8000"
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app

  dashboard:
    build: .
    container_name: credit_dashboard
    ports:
      - "8501:8501"
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
    volumes:
      - .:/app

  cli:
    build: .
    container_name: credit_cli
    command: python main.py
    volumes:
      - .:/app